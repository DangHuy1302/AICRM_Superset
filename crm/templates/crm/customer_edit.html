<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chỉnh sửa khách hàng | Northstar CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#172331; --muted:#718096; --line:#e7ecf2; --blue:#2f6fed; --navy:#172b4d; }
        * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:#f6f8fb; font:14px/1.5 "DM Sans",sans-serif; }
        .card { width:min(620px,100%); padding:32px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 14px 40px rgba(23,43,77,.09); }
        .eyebrow { color:var(--blue); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; } h1 { margin:6px 0 5px; font:800 25px Manrope,sans-serif; } .subtitle { margin:0 0 25px; color:var(--muted); }
        form p { margin:0 0 15px; } label { display:block; margin-bottom:6px; color:#516174; font-size:12px; font-weight:700; } input, select, textarea { width:100%; padding:10px 11px; border:1px solid #dce3eb; border-radius:8px; outline:0; color:var(--ink); background:#fff; font:inherit; } input:focus, select:focus, textarea:focus { border-color:#8bb0f7; box-shadow:0 0 0 3px #edf3ff; } textarea { resize:vertical; } .errorlist { margin:5px 0; padding:0; color:#b8424d; list-style:none; font-size:12px; }
        .actions { display:flex; gap:10px; margin-top:22px; } .actions a, .actions button { flex:1; padding:11px 16px; border:0; border-radius:8px; text-align:center; text-decoration:none; cursor:pointer; font:700 14px "DM Sans",sans-serif; } .back { color:var(--navy); background:#eef1f5; }.save { color:#fff; background:var(--blue); }
    </style>
</head>
<body>
    <main class="card">
        <div class="eyebrow">Customer profile</div>
        <h1>Chỉnh sửa khách hàng</h1>
        <p class="subtitle">Cập nhật thông tin hồ sơ của {{ customer.name }}.</p>
        <form method="post">{% csrf_token %}{{ form.as_p }}<div class="actions"><a class="back" href="{% url 'crm:dashboard' %}">Quay lại dashboard</a><button class="save" type="submit">Lưu thay đổi</button></div></form>
    </main>
</body>
</html>
